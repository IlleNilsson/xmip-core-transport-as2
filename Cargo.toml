[package]
name = "xmip-core-transport-as2"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-as2"
description = "AS2 transport: EDI over HTTP, RFC 4130 — one message is one Stream, its Party ids beside it, answered with a signed MDN; a Receive Location answers Parties, a Send Location posts to one. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The http technology is the carrier the manifest
# declares: AS2 is an HTTP POST with Party headers, answered with an MDN,
# and the request, the answer and the endpoint are read there. The MIC the
# MDN carries back (RFC 4130 section 7.3.1) is the estate's SHA-256
# (codec::digest). Standard library otherwise. The S/MIME signer the manifest names,
# xmip-core-authenticate-certificate, plugs in through the Signer trait. Its
# declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main", optional = true }
# HTTP/1.1 on the wire (`net::http`) and the URL an endpoint is
# (`net::Endpoint`): the one codec every technology riding on HTTP calls.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }
# The estate's encoding primitives: the MIC, and it in base 64.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:http", "dep:net", "dep:codec"]
# The declaration alone.
declaration = []
# HTTPS, through http's: this technology maps its scheme to https and could
# not reach a TLS stack until 2026-09-23; the technology's code, so the
# default with it.
tls = ["default", "http/tls"]
