# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-as2"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-as2"
description = "AS2 transport: EDI over HTTP, RFC 4130 — one message is one Stream, its partner ids beside it, answered with a signed MDN; a Receive Location answers partners, a Send Location posts to one. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The http technology is the carrier the manifest
# declares: AS2 is an HTTP POST with partner headers, answered with an MDN,
# and the request, the answer and the endpoint are read there. sha2 is the
# MIC the MDN carries back (RFC 4130 section 7.3.1). Standard library
# otherwise. The S/MIME signer the manifest names,
# xmip-core-authenticate-certificate, plugs in through the Signer trait.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
